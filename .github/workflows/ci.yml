name: Pravidhi CI

on:
  push:
  pull_request:

jobs:
  python-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall gateway engine agents cron memory research router_agent tests
      - run: pytest -q tests/test_commercial_security.py tests/test_agent_registry.py

  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall gateway engine agents cron memory research router_agent tests
      - run: pytest -q tests/test_commercial_security.py tests/test_agent_registry.py

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check packages/pravidhi-agentos/bin/pravidhi.js
